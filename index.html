<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museu dos Horrores Ambientais</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
<script src="selfie.bundle.js" defer></script>
<script src="idle.js" defer></script>
</head>
<body>
<main aria-label="Experiência em vídeo">
<section class="scene" aria-label="Seção 1: a entrada" id="scene-1">
<video playsinline preload="auto" muted poster="media/01.jpg" src="media/01.mp4" aria-label="Entrada do Museu dos Horrores Ambientais"></video>
<button class="advance advance-entry" aria-label="Entrar no museu"><span>Entrar no museu</span></button>
</section>
<section class="scene" aria-label="Seção 2: a jornada" id="scene-2" inert>
<video playsinline preload="metadata" muted poster="media/02.jpg" src="media/02.mp4" aria-label="Segundo ambiente do museu"></video>
<button class="advance" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
<section class="scene" aria-label="Seção 3" id="scene-3" inert>
<video playsinline preload="metadata" muted poster="media/03.jpg" src="media/03.mp4" aria-label="Ambiente 3 do museu"></video>
<button class="advance" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
<section class="scene" aria-label="Seção 4" id="scene-4" inert>
<video playsinline preload="metadata" muted poster="media/04.jpg" src="media/04.mp4" aria-label="Ambiente 4 do museu"></video>
<button class="advance" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
<section class="scene" aria-label="Seção 5" id="scene-5" inert>
<video playsinline preload="metadata" muted poster="media/05.jpg" src="media/05.mp4" aria-label="Ambiente 5 do museu"></video>
<button class="advance" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
<section class="scene" aria-label="Seção 6" id="scene-6" inert>
<video playsinline preload="metadata" muted poster="media/06.jpg" src="media/06.mp4" aria-label="Ambiente 6 do museu"></video>
<button class="advance" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
<section class="scene selfie-scene" id="selfie" aria-label="Selfie no museu" inert>
<div class="photo-stage">
<video id="camera" autoplay playsinline muted hidden></video>
<canvas id="photo" width="1080" height="1920" hidden></canvas>
<img id="selfie-frame" src="media/selfie-frame.png" alt="Moldura do Museu dos Horrores Ambientais" hidden>
<output id="countdown" aria-live="assertive"></output>
</div>
<div class="selfie-controls">
<p id="selfie-status" role="status">Leve uma lembrança do museu.</p>
<button id="capture" class="selfie-button">Tirar selfie</button>
<button id="retry-upload" class="selfie-button" hidden>Gerar QR code novamente</button>
<div id="qr-panel" hidden><canvas id="qr"></canvas><p>Escaneie para baixar sua selfie</p></div>
<button id="retake" class="selfie-button" hidden>Tirar outra</button>
<button id="restart" class="selfie-button secondary">Voltar ao início</button>
</div>
</section>
</main><p id="status" class="sr-only" role="status" aria-live="polite"></p>
</body></html>
