<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museu dos Horrores Ambientais</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main aria-label="Experiência em vídeo">
<section class="scene" aria-label="Seção 1: a entrada" id="scene-1">
<video playsinline preload="auto" muted poster="media/01.jpg" src="media/01.mp4" aria-label="Entrada do Museu dos Horrores Ambientais"></video>
<button class="advance" aria-label="Entrar"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
<section class="scene" aria-label="Seção 2: a jornada" id="scene-2" inert>
<video playsinline preload="metadata" muted poster="media/02.jpg" src="media/02.mp4" aria-label="Segundo ambiente do museu"></video>
<button class="advance" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</section>
</main><p id="status" class="sr-only" role="status" aria-live="polite"></p>
</body></html>
